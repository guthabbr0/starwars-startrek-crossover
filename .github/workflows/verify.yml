name: Verify game and prepare deployment
on:
  push:
    branches: [main]
    paths:
      - src/**
      - tests/**
      - scripts/**
      - assets/**
      - index.html
      - package.json
      - package-lock.json
      - vite.config.js
      - vercel.json
      - .github/workflows/verify.yml
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: game-verification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-fund
      - name: Simulation regression tests
        run: |
          mkdir -p reports
          npm test 2>&1 | tee reports/unit-tests.txt
      - name: Build production and self-contained bundle
        run: |
          npm run build 2>&1 | tee reports/build.txt
          npm run bundle:standalone
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Browser multiplayer and performance regression tests
        run: npm run test:browser
      - name: Package source and verification evidence
        if: always()
        run: |
          mkdir -p reports
          git rev-parse HEAD > reports/commit.txt
          printf '%s\n' '{"delivery":"Vercel native Git integration","note":"Deployment status is reported independently by Vercel. This CI job does not use or require VERCEL_TOKEN."}' > reports/delivery.json
          git ls-files -z | tar --null -T - -czf "$RUNNER_TEMP/stellar-rift-source.tar.gz"
          cp "$RUNNER_TEMP/stellar-rift-source.tar.gz" source.tar.gz
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: game-build-and-test-evidence
          path: |
            source.tar.gz
            reports/
            dist/
            standalone/
          retention-days: 7
          if-no-files-found: error
